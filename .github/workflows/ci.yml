# 实验03 步骤3：GitHub Actions 工作流配置
# 位置：.github/workflows/ci.yml
# 作用：每次 push 或提 PR 时自动安装依赖并运行 pytest 单元测试
name: Python单元测试

on: [push, pull_request]   # 推送或提PR时触发

jobs:
  test:
    runs-on: ubuntu-latest  # 在 GitHub 提供的 Ubuntu 最新版虚拟机上运行

    steps:
      - name: 检出代码
        uses: actions/checkout@v4   # 把仓库代码拉到虚拟机里

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'    # 指定 Python 版本

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 运行测试
        run: pytest -v                # -v 显示每个用例的详细结果
